<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hospital Management System - HMS</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .container {
            background: white;
            border-radius: 20px;
            padding: 50px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            max-width: 900px;
            width: 90%;
        }

        h1 {
            text-align: center;
            color: #667eea;
            font-size: 2.5rem;
            margin-bottom: 10px;
        }

        .subtitle {
            text-align: center;
            color: #666;
            margin-bottom: 40px;
            font-size: 1.1rem;
        }

        .cards {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 30px;
            margin-top: 30px;
        }

        .card {
            border: 2px solid #e0e0e0;
            border-radius: 15px;
            padding: 30px;
            text-align: center;
            transition: all 0.3s ease;
        }

        .card:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
            border-color: #667eea;
        }

        .card h2 {
            color: #333;
            font-size: 1.8rem;
            margin-bottom: 15px;
        }

        .card p {
            color: #666;
            margin-bottom: 25px;
            line-height: 1.6;
        }

        .btn {
            display: inline-block;
            padding: 12px 30px;
            margin: 5px;
            border-radius: 25px;
            text-decoration: none;
            font-weight: 600;
            transition: all 0.3s ease;
            border: 2px solid;
        }

        .btn-primary {
            background: #667eea;
            color: white;
            border-color: #667eea;
        }

        .btn-primary:hover {
            background: #5568d3;
            transform: scale(1.05);
        }

        .btn-secondary {
            background: transparent;
            color: #667eea;
            border-color: #667eea;
        }

        .btn-secondary:hover {
            background: #667eea;
            color: white;
        }

        .icon {
            font-size: 3rem;
            margin-bottom: 15px;
        }

        .admin-link {
            text-align: center;
            margin-top: 30px;
            padding-top: 20px;
            border-top: 1px solid #e0e0e0;
        }

        .admin-link a {
            color: #764ba2;
            text-decoration: none;
            font-weight: 600;
        }

        .admin-link a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🏥 Hospital Management System</h1>
        <p class="subtitle">Simplifying Healthcare Appointments</p>

        <div class="cards">
            <!-- Doctor Card -->
            <div class="card">
                <div class="icon">👨‍⚕️</div>
                <h2>For Doctors</h2>
                <p>Manage your schedule and appointments efficiently</p>
                <a href="/api/accounts/doctor/register/" class="btn btn-primary">Register</a>
                <a href="/api/accounts/login/" class="btn btn-secondary">Login</a>
            </div>

            <!-- Patient Card -->
            <div class="card">
                <div class="icon">👤</div>
                <h2>For Patients</h2>
                <p>Find doctors and book appointments easily</p>
                <a href="/api/accounts/patient/register/" class="btn btn-primary">Register</a>
                <a href="/api/accounts/login/" class="btn btn-secondary">Login</a>
            </div>
        </div>

        <div class="admin-link">
            <p>Administrator? <a href="/admin/">Access Admin Panel →</a></p>
        </div>
    </div>
</body>
</html>
